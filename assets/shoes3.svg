<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="#E8E5E2"/>
  <!-- Black Loafers - side view -->
  <g transform="translate(200,220)" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sole -->
    <path d="M-110,25 Q-112,15 -100,10 L110,10 Q122,15 120,25 L117,33 Q115,40 105,40 L-100,40 Q-110,40 -112,33 Z" stroke-width="2"/>
    <!-- Midsole -->
    <path d="M-105,10 Q-107,3 -95,0 L108,0 Q118,3 116,10 Z" stroke-width="1.5" opacity="0.5"/>
    <!-- Shoe upper body -->
    <path d="M-95,0 L-95,-30 Q-95,-42 -85,-48 L-40,-55 Q-20,-58 0,-52 L80,-38 Q100,-32 108,-22 L116,0" stroke-width="2"/>
    <!-- Moc toe seam -->
    <path d="M-95,-20 Q-60,-35 -20,-38 Q10,-38 30,-30" stroke-width="1.5" opacity="0.5"/>
    <!-- Toe box apron -->
    <path d="M-95,-20 Q-95,-30 -85,-35 L-50,-42 Q-30,-45 -15,-42 Q5,-38 25,-28 L20,-15" stroke-width="1.2" opacity="0.35"/>
    <!-- Apron seam detail -->
    <path d="M-85,-35 Q-50,-42 -15,-42" stroke-width="1" opacity="0.3" stroke-dasharray="3,2"/>
    <!-- Opening / collar -->
    <path d="M-75,-52 Q-30,-62 10,-50 Q25,-45 35,-38" stroke-width="2" opacity="0.6"/>
    <!-- Heel section -->
    <path d="M95,-30 L116,0 L105,0 L85,-15 Q82,-22 85,-28 Z" stroke-width="1.5" opacity="0.4"/>
    <!-- Heel counter seam -->
    <path d="M100,-25 L100,0" stroke-width="1" opacity="0.3"/>
    <!-- Strap detail across vamp -->
    <path d="M-60,-35 Q-20,-40 15,-30" stroke-width="2.5" opacity="0.4"/>
    <!-- Strap edge detail -->
    <path d="M-55,-32 Q-20,-37 10,-28" stroke-width="1" opacity="0.25"/>
    <!-- Subtle leather grain lines -->
    <path d="M-40,-10 Q-10,-18 20,-12" stroke-width="0.7" opacity="0.15"/>
    <path d="M-35,0 Q-5,-8 25,-2" stroke-width="0.7" opacity="0.15"/>
    <!-- Heel seat -->
    <path d="M105,0 L116,0" stroke-width="1" opacity="0.3"/>
  </g>
</svg>