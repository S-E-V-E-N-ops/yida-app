<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="#E6DFD3"/>
  <!-- Khaki Coat - front view -->
  <g transform="translate(200,200)" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M-58,-110 L-58,115 Q-58,125 -48,125 L48,125 Q58,125 58,115 L58,-110"/>
    <!-- Left sleeve -->
    <path d="M-58,-110 L-108,-60 Q-115,-52 -108,-44 L-88,60 Q-85,72 -78,72 L-58,72"/>
    <!-- Right sleeve -->
    <path d="M58,-110 L108,-60 Q115,-52 108,-44 L88,60 Q85,72 78,72 L58,72"/>
    <!-- Lapels -->
    <path d="M-15,-110 L-30,-60" stroke-width="2.5"/>
    <path d="M15,-110 L30,-60" stroke-width="2.5"/>
    <!-- Collar -->
    <path d="M-15,-110 Q0,-100 15,-110" stroke-width="2"/>
    <path d="M-25,-110 L-15,-110 L15,-110 L25,-110" stroke-width="1.5"/>
    <!-- Button placket -->
    <line x1="0" y1="-60" x2="0" y2="120" stroke-width="1.2" opacity="0.4"/>
    <!-- Buttons -->
    <circle cx="0" cy="-35" r="4" fill="#6B5E52" stroke="none" opacity="0.6"/>
    <circle cx="0" cy="5" r="4" fill="#6B5E52" stroke="none" opacity="0.6"/>
    <circle cx="0" cy="45" r="4" fill="#6B5E52" stroke="none" opacity="0.6"/>
    <!-- Belt -->
    <path d="M-58,65 L58,65" stroke-width="3" opacity="0.5"/>
    <path d="M-58,72 L58,72" stroke-width="3" opacity="0.5"/>
    <!-- Belt buckle -->
    <rect x="-8" y="65" width="16" height="7" rx="1" stroke-width="1.5" opacity="0.6"/>
    <!-- Left pocket flap -->
    <path d="M-50,30 L-15,30 L-15,15 L-50,15 Z" stroke-width="1.5" opacity="0.5"/>
    <!-- Right pocket flap -->
    <path d="M50,30 L15,30 L15,15 L50,15 Z" stroke-width="1.5" opacity="0.5"/>
    <!-- Cuffs -->
    <path d="M-85,67 L-58,67" stroke-width="1.5" opacity="0.5"/>
    <path d="M85,67 L58,67" stroke-width="1.5" opacity="0.5"/>
    <!-- Hem -->
    <path d="M-53,125 L53,125" stroke-width="2.5"/>
    <!-- Center fold -->
    <line x1="0" y1="-55" x2="0" y2="120" stroke-width="0.8" opacity="0.12"/>
  </g>
</svg>