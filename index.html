<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - AI 穿搭助手</title>
<style>
:root {
  --bg: #FAFAFA;
  --card: #FFFFFF;
  --text-primary: #171717;
  --text-secondary: #9A9A9A;
  --accent: #111111;
  --accent-light: #F2F2F2;
  --border: #E9E9E9;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: all 0.3s ease;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E9E9E9;
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.phone-frame {
  width: 390px; height: 844px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== Splash ===== */
.splash-screen {
  position: absolute; top:0; left:0;
  width:100%; height:100%;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.splash-screen.fade-out { opacity:0; transform:scale(1.05); pointer-events:none; }
.splash-logo {
  font-size: 48px; font-weight: 300; letter-spacing: 12px;
  color: var(--text-primary);
  opacity:0; transform:translateY(20px);
  animation: splashIn 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
}
.splash-subtitle {
  font-size: 13px; color: var(--text-secondary); letter-spacing: 4px;
  margin-top: 16px;
  opacity:0; transform:translateY(10px);
  animation: splashIn 1s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
}
.splash-line {
  width:40px; height:1px; background: var(--accent);
  margin-top: 20px;
  opacity:0; animation: splashIn 0.8s ease 1.1s forwards;
}
@keyframes splashIn { to { opacity:1; transform:translateY(0); } }

/* ===== Status Bar ===== */
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }

/* ===== Pages ===== */
.pages-container { flex:1; overflow:hidden; position:relative; }
.page {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden;
  transition: opacity 0.3s ease, transform 0.3s ease;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
}
.page.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
.page::-webkit-scrollbar { display:none; }

/* ===== Sub-pages ===== */
.sub-page {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  overflow-y:auto; background: var(--bg);
  z-index: 60;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.sub-page.active { transform:translateX(0); }
.sub-page::-webkit-scrollbar { display:none; }

.sub-header {
  display:flex; align-items:center;
  padding:16px 20px; gap:12px;
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.sub-header .back-btn {
  width:36px; height:36px; border:none; background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color: var(--text-primary); border-radius:50%; transition:var(--transition);
}
.sub-header .back-btn:hover { background:var(--accent-light); }
.sub-header .sub-title { font-size:17px; font-weight:600; }


/* ===== Match Page - Dressup Style ===== */
.match-page {
  padding-bottom: 18px;
  background:linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(250,250,250,0.72) 42%, #FAFAFA 100%);
}

.weather-bar {
  display:flex; align-items:center; gap:8px;
  width:calc(100% - 44px); min-height:42px;
  padding:0 18px; margin:0 auto 12px;
  font-size:12px; color:var(--text-secondary); letter-spacing:0.3px;
  background:rgba(255,255,255,0.78);
  border:1px solid rgba(17,17,17,0.06);
  border-radius:14px;
  box-shadow:0 10px 32px rgba(28,24,20,0.06);
  backdrop-filter:blur(18px);
}
.weather-bar svg { flex-shrink:0; }
.weather-bar .w-temp { font-weight:600; color:var(--text-primary); }

.occasion-bar { display:flex; gap:8px; padding:0 22px; margin-bottom:10px; overflow-x:auto; }
.occasion-bar::-webkit-scrollbar { display:none; }
.occasion-btn {
  padding:7px 16px; border-radius:999px; font-size:12px; font-weight:600;
  border:0; background:rgba(244,245,247,0.82); color:#5F5F5F;
  white-space:nowrap; cursor:pointer; transition:var(--transition);
}
.occasion-btn.active { background:var(--accent); color:var(--white); box-shadow:0 8px 20px rgba(17,17,17,0.16); }

/* ===== Picker-style rows (transform carousel, infinite loop) ===== */
.picker-section { margin-bottom:4px; padding:14px 0 10px; }
.picker-section-tops, .picker-section-shoes { background:rgba(244,245,247,0.88); }
.picker-section-bottoms { background:rgba(255,255,255,0.88); }
.picker-label {
  font-size:10px; font-weight:700; color:#A6A0A0;
  padding:0 24px; margin-bottom:4px; letter-spacing:2.4px; text-transform:uppercase;
  text-align:center;
}
.picker-title {
  font-size:19px; line-height:1; font-weight:700; color:var(--text-primary);
  text-align:center; margin-bottom:4px; letter-spacing:0;
}
.picker-viewport { width:100%; overflow:hidden; padding:4px 0 18px; touch-action:pan-y; }
.picker-track { display:flex; will-change:transform; transition:transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94); }
.picker-track.dragging { transition:none; }
.picker-card {
  flex:0 0 calc(100% / 3); min-width:0; padding:0 5px;
  cursor:pointer; user-select:none; display:flex; flex-direction:column; align-items:center;
}
.picker-card img {
  width:128px; height:128px; object-fit:contain; border-radius:0;
  transition:var(--transition); background:transparent; display:block;
  filter:drop-shadow(0 16px 18px rgba(38,32,28,0.12));
}
.picker-card .picker-name {
  font-size:11px; color:rgba(17,17,17,0.42); text-align:center; margin-top:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:var(--transition);
  opacity:0; max-width:120px;
}
.picker-card.selected img { transform:scale(1.16); filter:drop-shadow(0 20px 22px rgba(38,32,28,0.18)); }
.picker-card.selected .picker-name { opacity:0; }
.picker-card.adjacent { opacity:0.46; }
.picker-card.adjacent img { transform:scale(0.82); filter:drop-shadow(0 10px 12px rgba(38,32,28,0.08)); }

/* Action bar */
.action-bar { padding:0 16px; display:flex; gap:10px; margin:0 0 16px; }
.btn-ai-match {
  flex:1; height:48px; padding:0 20px; border:none; border-radius:24px;
  font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:var(--transition); background:var(--accent); color:var(--white); box-shadow:0 12px 28px rgba(17,17,17,0.18);
}
.btn-ai-match:hover { transform:translateY(-1px); }
.btn-ai-match svg { flex-shrink:0; }
.btn-fav {
  width:96px; height:48px; padding:0 14px; border:1px solid rgba(17,17,17,0.08); border-radius:24px;
  font-size:14px; font-weight:600; cursor:pointer; background:rgba(255,255,255,0.78); color:var(--text-primary);
  display:flex; align-items:center; justify-content:center; gap:6px; transition:var(--transition);
  box-shadow:0 12px 26px rgba(25,20,18,0.08); backdrop-filter:blur(18px);
}
.btn-fav:hover { border-color:var(--accent); }
.btn-fav.saved { background:var(--accent); color:var(--white); border-color:var(--accent); }

/* ===== Wardrobe Page ===== */
.page-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 12px;
}
.page-header h2 { font-size:22px; font-weight:700; }
.btn-add {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--card);
  color:var(--text-primary); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.btn-add:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }

.wardrobe-tabs {
  display:flex; gap:4px; padding:0 20px; margin-bottom:16px;
  overflow-x:auto; border-bottom:1px solid var(--border);
}
.wardrobe-tabs::-webkit-scrollbar { display:none; }
.wardrobe-tabs { scrollbar-width:none; -ms-overflow-style:none; }
.wardrobe-tab {
  padding:8px 12px 12px; font-size:13px; font-weight:500;
  color:var(--text-secondary); cursor:pointer;
  border:none; background:none; position:relative;
  transition:var(--transition); white-space:nowrap;
}
.wardrobe-tab.active { color:var(--accent); }
.wardrobe-tab.active::after {
  content:''; position:absolute;
  bottom:-1px; left:0; right:0;
  height:2px; background:var(--accent); border-radius:1px;
}

.wardrobe-grid {
  padding:0 16px;
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.wardrobe-card {
  background:var(--card); border-radius:var(--radius-sm);
  overflow:hidden; box-shadow:var(--shadow-sm);
  cursor:pointer; transition:var(--transition);
}
.wardrobe-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.wardrobe-card .card-img { width:100%; height:120px; object-fit:contain; padding:8px; background:#fff; }
.wardrobe-card .card-info { padding:8px; }
.wardrobe-card .card-name { font-size:11px; font-weight:500; margin-bottom:2px; }
.wardrobe-card .card-color {
  font-size:10px; color:var(--text-secondary);
  display:inline-block; padding:2px 6px;
  background:var(--accent-light); border-radius:4px;
}

/* ===== AI Assistant Page ===== */
.ai-hero-cards { padding:0 16px; margin-bottom:24px; }
.ai-card {
  background:var(--card); border-radius:var(--radius-lg);
  padding:20px; margin-bottom:12px;
  box-shadow:var(--shadow-sm); cursor:pointer;
  transition:var(--transition);
  display:flex; align-items:flex-start; gap:16px;
}
.ai-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
.ai-card .card-icon-wrap {
  width:44px; height:44px; border-radius:var(--radius-sm);
  background:var(--accent-light);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; color:var(--accent);
}
.ai-card .card-text-wrap { flex:1; }
.ai-card .card-title { font-size:15px; font-weight:600; margin-bottom:4px; }
.ai-card .card-desc { font-size:13px; color:var(--text-secondary); }
.ai-card .card-arrow { color:var(--text-secondary); align-self:center; flex-shrink:0; }

.section-divider {
  display:flex; align-items:center;
  padding:0 16px; margin-bottom:16px; gap:12px;
}
.section-divider::before, .section-divider::after {
  content:''; flex:1; height:1px; background:var(--border);
}
.section-divider span { font-size:12px; color:var(--text-secondary); white-space:nowrap; }

.recent-outfits {
  padding:0 16px 18px;
  display:flex; flex-direction:column; gap:10px;
}
.recent-outfit-card {
  width:100%; background:var(--card); border-radius:var(--radius-md);
  padding:10px 12px; box-shadow:var(--shadow-sm); cursor:pointer;
  display:flex; align-items:center; gap:12px; transition:var(--transition);
}
.recent-outfit-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
.recent-outfit-card .outfit-imgs {
  width:116px; flex-shrink:0;
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
}
.recent-outfit-card .outfit-imgs img { width:100%; height:46px; object-fit:contain; border-radius:6px; background:#fff; }
.recent-outfit-card .outfit-label { font-size:11px; line-height:1.35; color:var(--text-secondary); }

/* ===== Profile ===== */
.profile-header { text-align:center; padding:20px 20px 16px; }
.profile-avatar {
  width:64px; height:64px; border-radius:50%; background:var(--accent-light);
  margin:0 auto 12px;
  display:flex; align-items:center; justify-content:center; color:var(--accent);
  overflow:hidden;
}
.profile-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.profile-name { font-size:18px; font-weight:600; margin-bottom:4px; }
.profile-stats { font-size:13px; color:var(--text-secondary); }

.profile-menu { padding:0 16px; }
.menu-item {
  display:flex; align-items:center; gap:14px;
  padding:16px; background:var(--card);
  border-radius:var(--radius-md); margin-bottom:8px;
  cursor:pointer; transition:var(--transition); box-shadow:var(--shadow-sm);
}
.menu-item:hover { box-shadow:var(--shadow-md); }
.menu-item .menu-icon {
  width:36px; height:36px; border-radius:var(--radius-sm);
  background:var(--accent-light);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); flex-shrink:0;
}
.menu-item .menu-label { flex:1; font-size:14px; font-weight:500; }
.menu-item .menu-arrow { color:var(--text-secondary); }
.menu-item .menu-badge {
  font-size:12px; color:var(--text-secondary);
  background:var(--accent-light); padding:2px 8px; border-radius:4px;
}

/* ===== AI Result Sub-page ===== */
.ai-result-weather {
  display:flex; align-items:center; gap:8px;
  padding:12px 20px; margin:0 16px 16px;
  background:var(--card); border-radius:var(--radius-md);
  font-size:13px; color:var(--text-secondary);
}
.ai-result-items { padding:0 16px; margin-bottom:16px; }
.ai-result-item {
  background:var(--card); border-radius:var(--radius-md);
  overflow:hidden; margin-bottom:12px; box-shadow:var(--shadow-sm);
}
.ai-result-item img { width:100%; height:180px; object-fit:cover; }
.ai-result-item .item-label {
  padding:10px 16px; font-size:14px; font-weight:500;
  display:flex; align-items:center; justify-content:space-between;
}
.ai-result-item .item-label .item-cat { font-size:12px; color:var(--text-secondary); }
.ai-result-nav {
  display:flex; align-items:center; justify-content:center;
  gap:20px; padding:12px;
}
.ai-result-nav button {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--card);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text-primary); transition:var(--transition);
}
.ai-result-nav button:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }
.ai-result-nav .nav-counter { font-size:14px; color:var(--text-secondary); font-weight:500; }
.ai-result-actions { display:flex; gap:10px; padding:0 16px; margin-bottom:24px; }
.ai-result-actions button {
  flex:1; padding:12px; border-radius:var(--radius-xl);
  font-size:14px; font-weight:500; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:var(--transition); border:none;
}
.ai-result-actions .btn-rfav { background:var(--card); color:var(--text-primary); border:1px solid var(--border) !important; }
.ai-result-actions .btn-rfav.saved { background:var(--accent); color:var(--white); border-color:var(--accent) !important; }
.ai-result-actions .btn-rrefresh { background:var(--accent-light); color:var(--accent); }

/* ===== Consult Sub-page ===== */
.consult-form { padding:0 16px; }
.upload-area {
  background:var(--card); border:2px dashed var(--border);
  border-radius:var(--radius-md); padding:36px 20px;
  text-align:center; cursor:pointer; transition:var(--transition); margin-bottom:20px;
}
.upload-area:hover { border-color:var(--accent); background:var(--accent-light); }
.upload-area svg { margin-bottom:8px; color:var(--text-secondary); }
.upload-area p { font-size:14px; color:var(--text-secondary); }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:var(--text-secondary); }
.form-group input, .form-group select {
  width:100%; padding:10px 14px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:14px;
  background:var(--card); color:var(--text-primary); outline:none;
  transition:var(--transition); font-family:inherit;
}
.form-group input:focus, .form-group select:focus { border-color:var(--accent); }
.btn-analyze { width:100%; padding:14px; border:none; border-radius:var(--radius-xl); font-size:15px; font-weight:600; cursor:pointer; background:var(--accent); color:var(--white); transition:var(--transition); margin-top:8px; }
.btn-analyze:hover { opacity:0.9; }

.report-card { margin:0 16px 14px; background:var(--card); border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow-sm); }
.report-title { font-size:15px; font-weight:600; margin-bottom:8px; }
.report-stars { color:var(--accent); font-size:16px; margin-bottom:4px; letter-spacing:2px; }
.report-desc { font-size:13px; color:var(--text-secondary); line-height:1.6; }
.report-tag { display:inline-block; padding:4px 10px; background:var(--accent-light); color:var(--accent); border-radius:4px; font-size:12px; font-weight:500; margin-top:8px; }
.report-actions { display:flex; gap:10px; padding:0 16px; margin-bottom:24px; }
.report-actions button { flex:1; padding:12px; border-radius:var(--radius-xl); font-size:14px; font-weight:500; cursor:pointer; border:none; transition:var(--transition); }
.report-actions .btn-reanalyze { background:var(--accent-light); color:var(--accent); }
.report-actions .btn-save-report { background:var(--accent); color:var(--white); }

/* ===== Favorites ===== */
.fav-list { padding:0 16px; }
.fav-card {
  background:var(--card); border-radius:var(--radius-md);
  overflow:hidden; margin-bottom:12px; box-shadow:var(--shadow-sm);
}
.fav-card .fav-outfit-row { display:flex; gap:4px; padding:12px; }
.fav-card .fav-outfit-row img { flex:1; height:70px; object-fit:cover; border-radius:4px; }
.fav-card .fav-detail { padding:0 12px 12px; }
.fav-card .fav-detail .fav-text { font-size:13px; color:var(--text-secondary); margin-bottom:4px; }
.fav-card .fav-detail .fav-date { font-size:11px; color:var(--text-secondary); opacity:0.6; }
.fav-card .fav-actions { display:flex; gap:8px; padding:0 12px 12px; }
.fav-card .fav-actions button {
  flex:1; padding:10px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:500; cursor:pointer;
  border:none; transition:var(--transition);
}
.fav-card .fav-actions .btn-unfav { background:var(--accent-light); color:var(--accent); }
.fav-card .fav-actions .btn-rematch { background:var(--card); color:var(--text-primary); border:1px solid var(--border) !important; }
.fav-empty { text-align:center; padding:60px 40px; color:var(--text-secondary); font-size:14px; }

/* ===== Item Modal ===== */
.item-modal {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:150; opacity:0; pointer-events:none;
  transition:opacity 0.3s ease;
}
.item-modal.show { opacity:1; pointer-events:auto; }
.item-modal .modal-content {
  position:relative;
  background:var(--card); border-radius:var(--radius-lg);
  width:280px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.item-modal .modal-img { width:100%; height:260px; object-fit:contain; padding:16px 18px 8px; background:#fff; }
.outfit-detail { padding:16px 18px 18px; }
.outfit-detail-title { font-size:16px; font-weight:700; margin-bottom:6px; }
.outfit-detail-meta { font-size:12px; color:var(--text-secondary); margin-bottom:14px; }
.outfit-detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.outfit-detail-piece { min-width:0; }
.outfit-detail-piece img { width:100%; height:96px; object-fit:contain; background:#fff; border-radius:10px; padding:6px; }
.outfit-detail-piece-name { margin-top:6px; font-size:10px; line-height:1.3; color:var(--text-primary); text-align:center; word-break:break-all; }
.item-modal .modal-info { padding:16px 20px; }
.item-modal .modal-name { font-size:16px; font-weight:600; margin-bottom:4px; }
.item-modal .modal-color {
  display:inline-block; padding:3px 10px;
  background:var(--accent-light); border-radius:4px;
  font-size:12px; color:var(--text-secondary); margin-bottom:12px;
}
.item-modal .modal-close {
  position:static; z-index:3;
  width:34px; height:34px; padding:0; margin-top:18px;
  border:1px solid rgba(0,0,0,0.22); border-radius:50%;
  background:rgba(255,255,255,0.88); color:#111;
  cursor:pointer; font-size:0; line-height:0;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.16);
  backdrop-filter:blur(12px);
}
.item-modal .modal-close::before, .item-modal .modal-close::after {
  content:""; position:absolute; width:13px; height:1.6px;
  background:#111; border-radius:1px;
}
.item-modal .modal-close::before { transform:rotate(45deg); }
.item-modal .modal-close::after { transform:rotate(-45deg); }
.item-modal .modal-close:hover { background:rgba(255,255,255,0.95); border-color:rgba(0,0,0,0.34); }

/* ===== Tab Bar ===== */
.tab-bar {
  height:80px; background:var(--card);
  border-top:1px solid var(--border);
  display:flex; align-items:flex-start;

}
.tab-item {

.tab-item svg { transition:var(--transition); }
.tab-item.active { color:var(--accent); }
.tab-item.active svg { transform:scale(1.1); }

/* ===== Toast ===== */
.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;

}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ===== Loading ===== */
.loading-overlay {

@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:14px; color:var(--text-secondary); font-weight:500; }

@media (max-width:440px) {

// ===== BUILD MATCH PAGE (Centered carousel) =====


const carouselState = {}; // per-key: { virtualIdx, isAnimating }
const LOOP_COPIES = 3;
const LOOP_MIDDLE = 1;

function buildMatchPage() {
  const container = document.getElementById('match-categories');
  container.innerHTML = '';

  Object.entries(categoryMeta).forEach(([key, meta]) => {
    const items = wardrobe[key];
    carouselState[key] = { virtualIdx: items.length + state.selected[key], isAnimating: false };

    const section = document.createElement('div');
    section.className = `picker-section picker-section-${key}`;
    section.innerHTML = `
      <div class="picker-label">${meta.eyebrow}</div>
      <div class="picker-title" id="title-${key}"></div>
      <div class="picker-viewport" id="vp-${key}">
        <div class="picker-track" id="track-${key}"></div>
      </div>
    `;
    container.appendChild(section);

    const track = section.querySelector('.picker-track');
    for (let copy = 0; copy < LOOP_COPIES; copy++) {
      items.forEach((item, i) => track.appendChild(createPickerCard(key, i, item, copy * items.length + i)));
    }

    updatePickerVisuals(key);
    requestAnimationFrame(() => setPickerTransform(key, carouselState[key].virtualIdx, false));
    setupPickerTouch(key);
  });

  updatePreview();
}

function createPickerCard(key, realIdx, item, virtualIdx) {
  const card = document.createElement('div');
  card.className = 'picker-card';
  card.dataset.realIdx = realIdx;
  card.dataset.virtualIdx = virtualIdx;
  card.innerHTML = `
    <img src="${item.image}" alt="${item.name}" loading="lazy">
    <div class="picker-name">${item.name}</div>
  `;
  card.addEventListener('click', () => {
    if (carouselState[key].isAnimating) return;
    animatePickerToVirtual(key, parseInt(card.dataset.virtualIdx, 10));
  });
  return card;
}

function getTrackTranslateX(track) {
  const transform = window.getComputedStyle(track).transform;
  if (!transform || transform === 'none') return 0;
  const matrix = new DOMMatrixReadOnly(transform);
  return matrix.m41;
}

function setPickerTransform(key, virtualIdx, animate) {
  const track = document.getElementById(`track-${key}`);
  const vp = document.getElementById(`vp-${key}`);
  if (!track || !vp) return;
  const cards = track.querySelectorAll('.picker-card');
  const selectedCard = cards[virtualIdx];
  if (!selectedCard) return;
  track.style.transition = animate ? '' : 'none';
  const cardCenter = selectedCard.offsetLeft + selectedCard.offsetWidth / 2;
  const targetX = vp.clientWidth / 2 - cardCenter;
  track.style.transform = `translate3d(${Math.round(targetX)}px,0,0)`;
  if (!animate) {
    track.offsetHeight;
    track.style.transition = '';
  }
}

function normalizeVirtualIndex(key) {
  const items = wardrobe[key];
  const n = items.length;
  const realIdx = ((carouselState[key].virtualIdx % n) + n) % n;
  carouselState[key].virtualIdx = LOOP_MIDDLE * n + realIdx;
  state.selected[key] = realIdx;
  updatePickerVisuals(key);
  setPickerTransform(key, carouselState[key].virtualIdx, false);
}

function animatePickerTo(key, realIdx) {
  const n = wardrobe[key].length;
  animatePickerToVirtual(key, LOOP_MIDDLE * n + realIdx);
}

function animatePickerToVirtual(key, virtualIdx) {
  const n = wardrobe[key].length;
  carouselState[key].isAnimating = true;
  carouselState[key].virtualIdx = virtualIdx;
  state.selected[key] = ((virtualIdx % n) + n) % n;
  updatePickerVisuals(key);
  updatePreview();

  requestAnimationFrame(() => setPickerTransform(key, virtualIdx, true));

  setTimeout(() => {
    normalizeVirtualIndex(key);
    carouselState[key].isAnimating = false;
  }, 380);
}

function updatePickerTitle(key) {
  const title = document.getElementById(`title-${key}`);
  const item = wardrobe[key][state.selected[key]];
  if (title && item) title.textContent = item.name;
}

function updatePickerVisuals(key) {
  const track = document.getElementById(`track-${key}`);
  if (!track) return;
  const selectedIdx = state.selected[key];
  const n = wardrobe[key].length;
  updatePickerTitle(key);
  track.querySelectorAll('.picker-card').forEach(card => {
    const ri = parseInt(card.dataset.realIdx, 10);
    card.classList.remove('selected', 'adjacent');
    if (ri === selectedIdx) {
      card.classList.add('selected');
    } else {
      const diff = Math.min(Math.abs(ri - selectedIdx), n - Math.abs(ri - selectedIdx));
      if (diff === 1) card.classList.add('adjacent');
    }
  });
}

function setupPickerTouch(key) {
  const vp = document.getElementById(`vp-${key}`);
  const track = document.getElementById(`track-${key}`);
  if (!vp || !track) return;
  const n = wardrobe[key].length;

  let startX = 0, startY = 0, deltaX = 0, baseX = 0, isDragging = false, isHorizontal = null;

  function onStart(clientX, clientY) {
    startX = clientX; startY = clientY;
    deltaX = 0; baseX = getTrackTranslateX(track);
    isDragging = true; isHorizontal = null;
    track.classList.add('dragging');
  }
  function onMove(clientX, clientY) {
    if (!isDragging) return;
    const dx = clientX - startX;
    const dy = clientY - startY;
    if (isHorizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      isHorizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!isHorizontal) return;
    deltaX = dx;
    track.style.transform = `translate3d(${Math.round(baseX + deltaX)}px,0,0)`;
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if (!isHorizontal) { setPickerTransform(key, carouselState[key].virtualIdx, false); return; }

    const threshold = vp.clientWidth / 6;
    if (deltaX < -threshold) {
      animatePickerToVirtual(key, carouselState[key].virtualIdx + 1);
    } else if (deltaX > threshold) {
      animatePickerToVirtual(key, carouselState[key].virtualIdx - 1);
    } else {
      setPickerTransform(key, carouselState[key].virtualIdx, true);
    }
    isHorizontal = null;
  }

  vp.addEventListener('touchstart', e => { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  vp.addEventListener('touchmove', e => { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  vp.addEventListener('touchend', onEnd, { passive: true });
  vp.addEventListener('mousedown', e => { onStart(e.clientX, e.clientY); e.preventDefault(); });
  vp.addEventListener('mousemove', e => { onMove(e.clientX, e.clientY); });
  vp.addEventListener('mouseup', onEnd);
  vp.addEventListener('mouseleave', () => {
    if (isDragging) {
      isDragging = false;
      track.classList.remove('dragging');
      setPickerTransform(key, carouselState[key].virtualIdx, false);
    }
  });
}

// ===== FAVORITE =====
function toggleFav() {
  const outfit = getCurrentOutfit();
  const dup = state.favorites.some(f =>
    f.top && f.top.id === outfit.top.id && f.bottom.id === outfit.bottom.id && f.shoes.id === outfit.shoes.id
  );
  if (dup) {
    // Un-fav
    state.favorites = state.favorites.filter(f =>
      !(f.top && f.top.id === outfit.top.id && f.bottom.id === outfit.bottom.id && f.shoes.id === outfit.shoes.id)
    );
    updateFavBtn(false);
    showToast('已取消收藏');
    document.getElementById('fav-count').textContent = state.favorites.length;
    return;
  }
  state.favorites.push({...outfit, date: new Date().toLocaleDateString('zh-CN')});
  updateFavBtn(true);
  showToast('已收藏');
  document.getElementById('fav-count').textContent = state.favorites.length;
}

function updateFavBtn(saved) {
  const btn = document.getElementById('btn-fav');
  if (saved) {
    btn.classList.add('saved');
    btn.querySelector('svg path').setAttribute('fill','currentColor');
    btn.querySelector('span:last-child').textContent = '已收藏';
  } else {
    btn.classList.remove('saved');
    btn.querySelector('svg path').setAttribute('fill','none');
    btn.querySelector('span:last-child').textContent = '收藏';
  }
}

function isCurrentOutfitFaved() {
  const outfit = getCurrentOutfit();
  return state.favorites.some(f =>
    f.top && f.top.id === outfit.top.id && f.bottom.id === outfit.bottom.id && f.shoes.id === outfit.shoes.id
  );
}

function syncFavBtnState() {
  updateFavBtn(isCurrentOutfitFaved());
}

function getCurrentOutfit() {
  return {
    top: wardrobe.tops[state.selected.tops],
    bottom: wardrobe.bottoms[state.selected.bottoms],
    shoes: wardrobe.shoes[state.selected.shoes],
    occasion: state.occasion,
  };
}

// ===== TAB SWITCH =====
const tabSubMemory = { match:null, wardrobe:null, ai:null, profile:null };

function switchTab(name) {
  // Close all sub-pages first, but remember which was open for current tab
  document.querySelectorAll('.sub-page.active').forEach(sp => {
    const curTab = document.querySelector('.tab-item.active');
    if (curTab) tabSubMemory[curTab.dataset.page] = sp.id;
    sp.classList.remove('active');
  });

  // Switch main page
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(`page-${name}`).classList.remove('hidden');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-page="${name}"]`).classList.add('active');

  if (name === 'wardrobe') renderWardrobe();
  if (name === 'ai') renderRecent();
  if (name === 'match') syncFavBtnState();
  if (name === 'profile') {
    document.getElementById('fav-count').textContent = state.favorites.length;
    document.getElementById('profile-stats').textContent = `衣柜：${allItems.length} 件单品`;
  }

  // Restore sub-page for this tab if remembered
  const remembered = tabSubMemory[name];
  if (remembered) {
    if (remembered === 'sub-favorites') renderFavorites();
    if (remembered === 'sub-city') renderCityList();
    if (remembered === 'sub-stats') renderStats();
    document.getElementById(remembered).classList.add('active');
  }
}

// ===== AI API 配置（直接调用 DeepSeek） =====
// Demo 模式：默认不填 key，AI 返回模拟结果、不发网络请求，任何环境都能打开演示。
// 想接入真实 AI：去 https://platform.deepseek.com 申请 key 填到下面即可。
// ⚠️ 安全提醒：真实 key 不要提交到公开仓库（前端代码对访问者可见），线上部署请走 api/chat.js 代理。
const DEEPSEEK_KEY = ''; // 本地 Demo 留空即可
const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';

// 未配置有效 key 时跳过网络请求，直接走 mock 兜底
function hasAIConfigured() {
  return DEEPSEEK_KEY && DEEPSEEK_KEY.trim() !== ''
    && !DEEPSEEK_KEY.includes('your-api-key')
    && !DEEPSEEK_KEY.includes('sk-your-key');
}

async function callDeepSeek(systemPrompt, userPrompt) {
  if (!hasAIConfigured()) return null;
  try {
    const res = await fetch(DEEPSEEK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${DEEPSEEK_KEY}`,
      },
      body: JSON.stringify({
        model: 'deepseek-v4-flash', // 2026-07 起 deepseek-chat 别名已弃用
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        thinking: { type: 'disabled' }, // 关思考：搭配任务是规则跟随，不需推理链，省延迟省token
        response_format: { type: 'json_object' }, // 强制合法 JSON，替代正则抽取
        temperature: 0.7,
        max_tokens: 800,
      }),
    });
    const data = await res.json();
    if (data.choices && data.choices[0]) {
      const content = data.choices[0].message.content;
      // 提取 JSON
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      return jsonMatch ? JSON.parse(jsonMatch[0]) : { raw: content };
    }
    return null;
  } catch (e) {
    console.error('DeepSeek call failed:', e);
    return null;
  }
}

async function callAIMatch(lockedItem) {
  document.getElementById('loading').classList.add('show');
  document.getElementById('loading').querySelector('.loading-text').textContent = 'AI 正在搭配…';

  const systemPrompt = `你是一个专业的女性穿搭顾问。根据用户衣柜推荐搭配。

只返回JSON，不要其他文字：
{
  "top_id": 数字,
  "bottom_id": 数字,
  "shoes_id": 数字,
  "explanation": "一句话搭配理由"
}

规则：全身不超过3个主色；基础色任意搭；亮色只配一件。
场合：上课→休闲，约会→精致，面试→正式，通勤→简约，运动→运动休闲。`;

  const lockedNote = lockedItem
    ? `用户已选中：${lockedItem.name}（${lockedItem.category}），保留这件搭配其他。`
    : '请从所有品类各选一件。';

  const userPrompt = `天气25°C晴，场合"${state.occasion}"。${lockedNote}

衣柜：
上衣：${JSON.stringify(wardrobe.tops.map(i => ({ id: i.id, name: i.name, color: i.color })))}
下装：${JSON.stringify(wardrobe.bottoms.map(i => ({ id: i.id, name: i.name, color: i.color })))}
鞋子：${JSON.stringify(wardrobe.shoes.map(i => ({ id: i.id, name: i.name, color: i.color })))}

返回JSON推荐一套搭配。`;

  const result = await callDeepSeek(systemPrompt, userPrompt);
  document.getElementById('loading').classList.remove('show');
  return result;
}

async function callAIConsult(data) {
  document.getElementById('loading').classList.add('show');
  document.getElementById('loading').querySelector('.loading-text').textContent = 'AI 正在分析…';

  const systemPrompt = `你是一个女性穿搭顾问。分析一件新衣服是否值得买。

返回JSON：
{
  "compatibility": { "score": 数字1-5, "text": "兼容性说明" },
  "styleMatch": { "score": 数字1-5, "text": "风格说明" },
  "value": { "level": "高/中/低", "reason": "理由" },
  "alternative": "衣柜里有啥替代品",
  "verdict": "推荐入手/可以再想想/不推荐"
}`;

  const userPrompt = `用户想买：${data.name}，${data.price}元，${data.material}，${data.color}，${data.occasion}场合。用户风格偏好：${(data.userStyles || []).join('、')}。请分析。返回JSON。`;

  const result = await callDeepSeek(systemPrompt, userPrompt);
  document.getElementById('loading').classList.remove('show');
  return result;
}

async function generateAIResults() {
  state.aiResults = [];

  // 尝试调用真实 API
  const result = await callAIMatch(null);
  if (result && result.top_id && result.bottom_id && result.shoes_id) {
    // API 成功，用 AI 推荐的结果
    const findItem = (id) => allItems.find(i => i.id === id);
    const top = findItem(result.top_id);
    const bottom = findItem(result.bottom_id);
    const shoes = findItem(result.shoes_id);
    if (top && bottom && shoes) {
      state.aiResults.push({ top, bottom, shoes, aiReason: result.explanation || '' });
    }
    // 再生成 7 个随机搭配补全
    for (let i=0; i<7; i++) {
      state.aiResults.push({
        top: wardrobe.tops[Math.floor(Math.random()*wardrobe.tops.length)],
        bottom: wardrobe.bottoms[Math.floor(Math.random()*wardrobe.bottoms.length)],
        shoes: wardrobe.shoes[Math.floor(Math.random()*wardrobe.shoes.length)],
      });
    }
  } else {
    // API 失败或未配置，回退到纯随机
    for (let i=0; i<8; i++) {
      state.aiResults.push({
        top: wardrobe.tops[Math.floor(Math.random()*wardrobe.tops.length)],
        bottom: wardrobe.bottoms[Math.floor(Math.random()*wardrobe.bottoms.length)],
        shoes: wardrobe.shoes[Math.floor(Math.random()*wardrobe.shoes.length)],
      });
    }
  }
  renderAIResult();
}
function renderAIResult() {
  const r = state.aiResults[state.aiResultIdx]; if (!r) return;
  document.getElementById('result-top-img').src = r.top.image;
  document.getElementById('result-top-name').textContent = r.top.name;
  document.getElementById('result-bottom-img').src = r.bottom.image;
  document.getElementById('result-bottom-name').textContent = r.bottom.name;
  document.getElementById('result-shoes-img').src = r.shoes.image;
  document.getElementById('result-shoes-name').textContent = r.shoes.name;
  document.getElementById('result-counter').textContent = `${state.aiResultIdx+1} / ${state.aiResults.length}`;
}
function navResult(dir) {
  let n = state.aiResultIdx + dir;
  if (n<0) n=state.aiResults.length-1;
  if (n>=state.aiResults.length) n=0;
  state.aiResultIdx = n;
  renderAIResult();
}
function refreshResults() { generateAIResults(); state.aiResultIdx=0; renderAIResult(); showToast('已刷新搭配'); }
function toggleResultFav() {
  const r = state.aiResults[state.aiResultIdx];
  const dup = state.favorites.some(f => f.top&&f.top.id===r.top.id && f.bottom.id===r.bottom.id && f.shoes.id===r.shoes.id);
  if (dup) { showToast('已收藏过'); return; }
  state.favorites.push({...r, occasion:state.occasion, date:new Date().toLocaleDateString('zh-CN')});

  btn.classList.add('saved'); btn.querySelector('svg path').setAttribute('fill','currentColor');

    <button onclick="saveStylePref()" style="width:100%;padding:14px;border:none;border-radius:var(--radius-xl);font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--white);transition:var(--transition);">保存偏好</button>
    <style>
      .style-card{padding:14px;background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition);text-align:center;border:2px solid transparent;}
      .style-card:hover{box-shadow:var(--shadow-md);}
      .style-card.selected{border-color:var(--accent);background:var(--accent-light);}
      .color-chip.selected{background:var(--accent);color:var(--white);border-color:var(--accent);}
    </style>
  `;
}

function toggleStyle(id) {
  const idx = selectedStyles.indexOf(id);
  if (idx >= 0) selectedStyles.splice(idx, 1);
  else selectedStyles.push(id);
  renderStylePref();
}

state.colorPrefs = ['黑','白','米'];
function toggleColorPref(color) {
  if (!state.colorPrefs) state.colorPrefs = [];
  const idx = state.colorPrefs.indexOf(color);
  if (idx >= 0) state.colorPrefs.splice(idx, 1);
  else state.colorPrefs.push(color);
  renderStylePref();
}

function saveStylePref() {
  const labels = selectedStyles.map(id => styles.find(s=>s.id===id)?.name).filter(Boolean);
  document.getElementById('style-badge').textContent = labels.slice(0,2).join('、') || '未设置';
  showToast(`风格偏好已保存：${labels.join('、')}`);
}

// ===== SETTINGS =====
const settingsState = {
  notifications: true,
  darkMode: false,
  autoWeather: true,
  language: '中文',
};

function renderSettings() {
  const c = document.getElementById('settings-content');
  c.innerHTML = `
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;font-weight:500;">通用设置</div>
    ${settingsToggle('通知提醒','notifications','每日穿搭提醒、搭配推荐推送', settingsState.notifications)}
    ${settingsToggle('自动获取天气','autoWeather','根据城市自动更新天气信息', settingsState.autoWeather)}
    ${settingsToggle('深色模式','darkMode','切换暗色主题', settingsState.darkMode)}

    <div style="font-size:13px;color:var(--text-secondary);margin:20px 0 14px;font-weight:500;">个性化</div>
    <div class="settings-row" onclick="showToast('语言设置（模拟）')">
      <span class="sr-label">语言</span>
      <span class="sr-value">${settingsState.language}</span>
    </div>
    <div class="settings-row" onclick="showToast('单位设置（模拟）')">
      <span class="sr-label">温度单位</span>
      <span class="sr-value">摄氏度 °C</span>
    </div>
    <div class="settings-row" onclick="showToast('隐私设置（模拟）')">
      <span class="sr-label">隐私与安全</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div style="font-size:13px;color:var(--text-secondary);margin:20px 0 14px;font-weight:500;">数据</div>
    <div class="settings-row" onclick="showToast('缓存已清除')">
      <span class="sr-label">清除缓存</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="settings-row" onclick="showToast('数据已导出')">
      <span class="sr-label">导出衣柜数据</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div style="text-align:center;margin-top:24px;font-size:12px;color:var(--text-secondary);opacity:0.5;">衣搭 v1.0.0</div>
    <style>
      .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;}
      .settings-row:last-child{border-bottom:none;}
      .sr-label{font-size:14px;font-weight:500;}
      .sr-value{font-size:13px;color:var(--text-secondary);}
      .settings-toggle{width:44px;height:26px;border-radius:13px;background:var(--border);cursor:pointer;position:relative;transition:var(--transition);flex-shrink:0;}
      .settings-toggle.on{background:var(--accent);}
      .settings-toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--white);box-shadow:var(--shadow-sm);transition:var(--transition);}
      .settings-toggle.on::after{left:21px;}
    </style>
  `;
}

function settingsToggle(label, key, desc, value) {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);">
      <div><div style="font-size:14px;font-weight:500;margin-bottom:2px;">${label}</div><div style="font-size:11px;color:var(--text-secondary);">${desc}</div></div>
      <div class="settings-toggle${value?' on':''}" onclick="toggleSetting('${key}')"></div>
    </div>
  `;
}

function toggleSetting(key) {
  settingsState[key] = !settingsState[key];
  renderSettings();
  showToast(`${key === 'notifications' ? '通知提醒' : key === 'darkMode' ? '深色模式' : '自动获取天气'}已${settingsState[key] ? '开启' : '关闭'}`);
}
function renderStats() {
  const c = document.getElementById('stats-content');
  const cats = [
    { key:'tops', label:'上衣', icon:'👚' },
    { key:'bottoms', label:'下装', icon:'👖' },
    { key:'shoes', label:'鞋子', icon:'👟' },
    { key:'bags', label:'包包', icon:'👜' },
    { key:'hats', label:'帽子', icon:'🎩' },
    { key:'accessories', label:'配饰', icon:'📿' },
  ];
  const total = allItems.length;
  const favCount = state.favorites.length;

  c.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;">
      <div style="background:var(--card);border-radius:var(--radius-md);padding:20px;text-align:center;box-shadow:var(--shadow-sm);">
        <div style="font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px;">${total}</div>
        <div style="font-size:12px;color:var(--text-secondary);">总单品数</div>
      </div>
      <div style="background:var(--card);border-radius:var(--radius-md);padding:20px;text-align:center;box-shadow:var(--shadow-sm);">
        <div style="font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px;">${favCount}</div>
        <div style="font-size:12px;color:var(--text-secondary);">收藏搭配</div>
      </div>
    </div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;">分类明细</div>
    ${cats.map(cat => {
      const count = wardrobe[cat.key].length;
      const pct = Math.round(count / total * 100);
      return `
        <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:20px;width:28px;text-align:center;">${cat.icon}</span>
          <span style="flex:1;font-size:14px;font-weight:500;">${cat.label}</span>
          <div style="width:120px;height:6px;background:var(--accent-light);border-radius:3px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:3px;transition:width 0.5s ease;"></div>
          </div>
          <span style="font-size:13px;color:var(--text-secondary);width:32px;text-align:right;">${count}</span>
        </div>
      `;
    }).join('')}
    <div style="margin-top:20px;padding:14px 16px;background:var(--accent-light);border-radius:var(--radius-md);font-size:13px;color:var(--accent);text-align:center;">
      穿搭潜力指数：还有 ${Math.max(0, 48 - total)} 件单品空间可扩展
    </div>
  `;
}

// ===== TOAST =====
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

buildMatchPage();
window.addEventListener('resize', () => {
  Object.keys(categoryMeta).forEach(key => normalizeVirtualIndex(key));
});
window.addEventListener('load', () => {
  Object.keys(categoryMeta).forEach(key => normalizeVirtualIndex(key));
});
buildWardrobeTabs();
renderWardrobe();
renderRecent();
</script>
</body>
