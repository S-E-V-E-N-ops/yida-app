<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - 开屏动画</title>
<style>
:root {
  --bg: #F8F8F6;
  --card: #FFFFFF;
  --text-primary: #2D2D2D;
  --text-secondary: #8C8C8C;
  --accent: #8B7E74;
  --accent-light: #F0EDEA;
  --border: #E8E8E5;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: all 0.3s ease;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E8E8E5;
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.phone-frame {
  width: 390px; height: 844px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== Splash ===== */
.splash-screen {
  position: absolute; top:0; left:0;
  width:100%; height:100%;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.splash-screen.fade-out { opacity:0; transform:scale(1.05); pointer-events:none; }
.splash-logo {
  font-size: 48px; font-weight: 300; letter-spacing: 12px;
  color: var(--text-primary);
  opacity:0; transform:translateY(20px);
  animation: splashIn 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
}
.splash-subtitle {
  font-size: 13px; color: var(--text-secondary); letter-spacing: 4px;
  margin-top: 16px;
  opacity:0; transform:translateY(10px);
  animation: splashIn 1s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
}
.splash-line {
  width:40px; height:1px; background: var(--accent);
  margin-top: 20px;
  opacity:0; animation: splashIn 0.8s ease 1.1s forwards;
}
@keyframes splashIn { to { opacity:1; transform:translateY(0); } }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="splash-screen" id="splash">
    <div class="splash-logo">衣搭</div>
    <div class="splash-subtitle">AI 穿搭助手</div>
    <div class="splash-line"></div>
  </div>
</div>
<script>
setTimeout(() => {
  document.getElementById('splash').classList.add('fade-out');
  setTimeout(() => document.getElementById('splash').style.display = 'none', 700);
}, 2800);
</script>
</body>
</html>
