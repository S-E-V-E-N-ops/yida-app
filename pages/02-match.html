<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - 搭配</title>
<style>
:root {
  --bg: #F8F8F6;
  --card: #FFFFFF;
  --text-primary: #2D2D2D;
  --text-secondary: #8C8C8C;
  --accent: #8B7E74;
  --accent-light: #F0EDEA;
  --border: #E8E8E5;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E8E8E5; color: var(--text-primary);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
}
.phone-frame {
  width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative; display: flex; flex-direction: column;
}

/* Status Bar */
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }

/* Pages */
.page { width:100%; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
.page::-webkit-scrollbar { display:none; }

/* Match Page */
.match-page { padding-bottom: 10px; }
.weather-bar {
  display:flex; align-items:center; gap:8px;
  padding:10px 20px; margin:0 16px 12px;
  background:var(--card); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); font-size:13px; color:var(--text-secondary);
}
.weather-bar svg { flex-shrink:0; }
.weather-bar .w-temp { font-weight:600; color:var(--text-primary); }

.occasion-bar {
  display:flex; gap:6px; padding:0 16px; margin-bottom:14px; overflow-x:auto;
}
.occasion-bar::-webkit-scrollbar { display:none; }
.occasion-btn {
  padding:6px 14px; border-radius:18px; font-size:12px; font-weight:500;
  border:none; background:var(--accent-light); color:var(--text-primary);
  white-space:nowrap; cursor:pointer; transition:var(--transition);
}
.occasion-btn.active { background:var(--accent); color:var(--white); }

/* Picker */
.picker-section { margin-bottom: 4px; }
.picker-label { font-size:11px; font-weight:500; color:var(--text-secondary); padding:0 24px; margin-bottom:6px; letter-spacing:1px; }
.picker-viewport { width:100%; overflow:hidden; padding:4px 0 12px; touch-action:pan-y; }
.picker-track { display:flex; will-change:transform; transition:transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94); }
.picker-track.dragging { transition:none; }
.picker-card { flex:0 0 calc(100% / 3); min-width:0; padding:0 6px; cursor:pointer; user-select:none; }
.picker-card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--radius-md); transition:var(--transition); background:var(--card); display:block; }
.picker-card .picker-name { font-size:10px; color:var(--text-secondary); text-align:center; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:var(--transition); }
.picker-card.selected img { outline: 2px solid var(--accent); outline-offset: 2px; }
.picker-card.selected .picker-name { color:var(--text-primary); font-weight:500; }
.picker-card.adjacent { opacity:0.45; }
.picker-card.adjacent img { transform:scale(0.92); }

/* Preview strip */
.preview-strip { margin:4px 20px 12px; padding:12px 16px; background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }
.preview-strip-title { font-size:11px; color:var(--text-secondary); margin-bottom:8px; letter-spacing:0.5px; }
.preview-items-row { display:flex; gap:8px; align-items:center; overflow-x:auto; padding-bottom:4px; }
.preview-items-row::-webkit-scrollbar { display:none; }
.preview-thumb { width:48px; height:48px; border-radius:var(--radius-sm); overflow:hidden; flex-shrink:0; box-shadow:var(--shadow-sm); }
.preview-thumb img { width:100%; height:100%; object-fit:cover; }
.preview-score { font-size:11px; color:var(--accent); font-weight:500; margin-top:6px; }

/* Action bar */
.action-bar { padding:0 16px; display:flex; gap:10px; margin-bottom:16px; }
.btn-ai-match {
  flex:1; padding:13px 20px; border:none; border-radius:var(--radius-xl);
  font-size:14px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:var(--transition);
  background:var(--accent); color:var(--white);
  box-shadow:0 4px 16px rgba(139,126,116,0.3);
}
.btn-ai-match:hover { transform:translateY(-1px); }
.btn-ai-match svg { flex-shrink:0; }
.btn-fav {
  padding:13px 20px; border:1px solid var(--border); border-radius:var(--radius-xl);
  font-size:14px; font-weight:500; cursor:pointer;
  background:var(--card); color:var(--text-primary);
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:var(--transition);
}
.btn-fav:hover { border-color:var(--accent); }
.btn-fav.saved { background:var(--accent); color:var(--white); border-color:var(--accent); }

/* Toast */
.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:500; z-index:300;
  opacity:0; transition:all 0.3s ease;
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#2D2D2D"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#2D2D2D"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D2D2D"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D2D2D" opacity="0.3"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#2D2D2D" stroke-width="1.5"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#2D2D2D"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#2D2D2D"/></svg>
    </div>
  </div>

  <div class="page match-page">
    <div class="weather-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B7E74" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      <span class="w-temp">25°C</span>
      <span>北京 · 晴</span>
    </div>
    <div class="occasion-bar">
      <button class="occasion-btn active" data-occasion="上课">上课</button>
      <button class="occasion-btn" data-occasion="约会">约会</button>
      <button class="occasion-btn" data-occasion="面试">面试</button>
      <button class="occasion-btn" data-occasion="通勤">通勤</button>
      <button class="occasion-btn" data-occasion="运动">运动</button>
    </div>
    <div id="match-categories"></div>
    <div class="preview-strip" id="preview-strip"></div>
    <div class="action-bar">
      <button class="btn-ai-match">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg>
        AI 搭配
      </button>
      <button class="btn-fav" id="btn-fav" onclick="toggleFav()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        收藏
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ===== DATA =====
const wardrobe = {
  tops: [
    { id:1,  name:'白色 T 恤',     color:'白色', category:'上衣', image:'../assets/gen_tshirt_white.jpg' },
    { id:2,  name:'蓝色衬衫',     color:'蓝色', category:'上衣', image:'../assets/gen_shirt_blue.jpg' },
    { id:3,  name:'米色针织衫',   color:'米色', category:'上衣', image:'../assets/gen_knit_beige.jpg' },
    { id:4,  name:'黑色卫衣',     color:'黑色', category:'上衣', image:'../assets/gen_hoodie_black.jpg' },
    { id:5,  name:'卡其风衣',     color:'卡其', category:'上衣', image:'../assets/gen_coat_khaki.jpg' },
    { id:6,  name:'灰色开衫',     color:'灰色', category:'上衣', image:'../assets/gen_cardigan_grey.jpg' },
  ],
  bottoms: [
    { id:7,  name:'蓝色牛仔裤',   color:'蓝色', category:'下装', image:'../assets/gen_jeans_blue.jpg' },
    { id:8,  name:'黑色西裤',     color:'黑色', category:'下装', image:'../assets/gen_pants_black.jpg' },
    { id:9,  name:'米色半身裙',   color:'米色', category:'下装', image:'../assets/gen_skirt_beige.jpg' },
    { id:10, name:'灰色运动裤',   color:'灰色', category:'下装', image:'../assets/gen_jogger_grey.jpg' },
    { id:11, name:'白色阔腿裤',   color:'白色', category:'下装', image:'../assets/gen_widepants_white.jpg' },
    { id:12, name:'卡其短裤',     color:'卡其', category:'下装', image:'../assets/gen_shorts_khaki.jpg' },
  ],
  shoes: [
    { id:13, name:'白色运动鞋',   color:'白色', category:'鞋子', image:'../assets/gen_sneakers_white.jpg' },
    { id:14, name:'棕色短靴',     color:'棕色', category:'鞋子', image:'../assets/gen_boots_brown.jpg' },
    { id:15, name:'黑色乐福鞋',   color:'黑色', category:'鞋子', image:'../assets/gen_loafers_black.jpg' },
    { id:16, name:'米色凉鞋',     color:'米色', category:'鞋子', image:'../assets/gen_sandals_beige.jpg' },
  ],
  bags: [
    { id:17, name:'黑色链条包',   color:'黑色', category:'包包', image:'../assets/gen_bag_black.jpg' },
    { id:18, name:'米色托特包',   color:'米色', category:'包包', image:'../assets/gen_bag_beige.jpg' },
    { id:19, name:'棕色肩背包',   color:'棕色', category:'包包', image:'../assets/gen_bag_brown.jpg' },
  ],
  hats: [
    { id:20, name:'黑色棒球帽',   color:'黑色', category:'帽子', image:'../assets/gen_hat_black.jpg' },
    { id:21, name:'米色草帽',     color:'米色', category:'帽子', image:'../assets/gen_hat_beige.jpg' },
    { id:22, name:'灰色毛线帽',   color:'灰色', category:'帽子', image:'../assets/gen_hat_grey.jpg' },
  ],
  accessories: [
    { id:23, name:'金色项链',     color:'金色', category:'配饰', image:'../assets/gen_acc_gold.jpg' },
    { id:24, name:'银色耳环',     color:'银色', category:'配饰', image:'../assets/gen_acc_silver.jpg' },
    { id:25, name:'酒红色丝巾',   color:'酒红', category:'配饰', image:'../assets/gen_acc_scarf.jpg' },
  ],
};

const allItems = [
  ...wardrobe.tops, ...wardrobe.bottoms, ...wardrobe.shoes,
  ...wardrobe.bags, ...wardrobe.hats, ...wardrobe.accessories
];

const categoryMeta = {
  tops:       { title:'上衣', key:'tops' },
  bottoms:    { title:'下装', key:'bottoms' },
  shoes:      { title:'鞋子', key:'shoes' },
};

// ===== STATE =====
const state = {
  selected: { tops:0, bottoms:0, shoes:0 },
  occasion: '上课',
  favorites: [],
};

// ===== CAROUSEL =====
const carouselState = {};

function buildMatchPage() {
  const container = document.getElementById('match-categories');
  container.innerHTML = '';

  Object.entries(categoryMeta).forEach(([key, meta]) => {
    const items = wardrobe[key];
    carouselState[key] = { offset: state.selected[key], isAnimating: false };

    const section = document.createElement('div');
    section.className = 'picker-section';
    section.innerHTML = `
      <div class="picker-label">${meta.title}</div>
      <div class="picker-viewport" id="vp-${key}">
        <div class="picker-track" id="track-${key}"></div>
      </div>
    `;
    container.appendChild(section);

    const track = section.querySelector('.picker-track');
    track.appendChild(createPickerCard(key, items.length - 1, items[items.length - 1]));
    items.forEach((item, i) => track.appendChild(createPickerCard(key, i, item)));
    track.appendChild(createPickerCard(key, 0, items[0]));

    updatePickerVisuals(key);
    setPickerTransform(key, state.selected[key], false);
    setupPickerTouch(key);
  });

  updatePreview();
}

function createPickerCard(key, realIdx, item) {
  const card = document.createElement('div');
  card.className = 'picker-card';
  card.dataset.realIdx = realIdx;
  card.innerHTML = `
    <img src="${item.image}" alt="${item.name}" loading="lazy">
    <div class="picker-name">${item.name}</div>
  `;
  card.addEventListener('click', () => {
    if (carouselState[key].isAnimating) return;
    const targetRealIdx = parseInt(card.dataset.realIdx);
    animatePickerTo(key, targetRealIdx);
  });
  return card;
}

function setPickerTransform(key, realIdx, animate) {
  const track = document.getElementById(`track-${key}`);
  const vp = document.getElementById(`vp-${key}`);
  if (!track || !vp) return;
  const vpWidth = vp.offsetWidth;
  const cardWidth = vpWidth / 3;
  const slot = realIdx + 1;
  const translateX = -(slot * cardWidth) + vpWidth / 2 - cardWidth / 2;
  track.style.transform = `translateX(${translateX}px)`;
}

function animatePickerTo(key, realIdx) {
  carouselState[key].isAnimating = true;
  setPickerTransform(key, realIdx, true);
  state.selected[key] = realIdx;
  updatePickerVisuals(key);
  updatePreview();
  setTimeout(() => { carouselState[key].isAnimating = false; }, 380);
}

function updatePickerVisuals(key) {
  const track = document.getElementById(`track-${key}`);
  if (!track) return;
  const selectedIdx = state.selected[key];
  const n = wardrobe[key].length;
  track.querySelectorAll('.picker-card').forEach(card => {
    const ri = parseInt(card.dataset.realIdx);
    card.classList.remove('selected', 'adjacent');
    if (ri === selectedIdx) {
      card.classList.add('selected');
    } else {
      const diff = Math.min(Math.abs(ri - selectedIdx), n - Math.abs(ri - selectedIdx));
      if (diff === 1) card.classList.add('adjacent');
    }
  });
}

function setupPickerTouch(key) {
  const vp = document.getElementById(`vp-${key}`);
  const track = document.getElementById(`track-${key}`);
  if (!vp || !track) return;
  const n = wardrobe[key].length;
  let startX = 0, startY = 0, deltaX = 0, isDragging = false, isHorizontal = null;

  function onStart(clientX, clientY) {
    startX = clientX; startY = clientY;
    deltaX = 0; isDragging = true; isHorizontal = null;
    track.classList.add('dragging');
  }
  function onMove(clientX, clientY) {
    if (!isDragging) return;
    const dx = clientX - startX;
    const dy = clientY - startY;
    if (isHorizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      isHorizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!isHorizontal) return;
    deltaX = dx;
    const vpWidth = vp.offsetWidth;
    const cardW = vpWidth / 3;
    const slot = state.selected[key] + 1;
    const baseX = -(slot * cardW) + vpWidth / 2 - cardW / 2;
    track.style.transform = `translateX(${baseX + deltaX}px)`;
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if (!isHorizontal) { setPickerTransform(key, state.selected[key], false); return; }
    const vpWidth = vp.offsetWidth;
    const threshold = vpWidth / 6;
    if (deltaX < -threshold) {
      let next = (state.selected[key] + 1) % n;
      animatePickerTo(key, next);
    } else if (deltaX > threshold) {
      let prev = (state.selected[key] - 1 + n) % n;
      animatePickerTo(key, prev);
    } else {
      setPickerTransform(key, state.selected[key], true);
    }
    isHorizontal = null;
  }

  vp.addEventListener('touchstart', e => { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  vp.addEventListener('touchmove', e => { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  vp.addEventListener('touchend', onEnd, { passive: true });
  vp.addEventListener('mousedown', e => { onStart(e.clientX, e.clientY); e.preventDefault(); });
  vp.addEventListener('mousemove', e => { onMove(e.clientX, e.clientY); });
  vp.addEventListener('mouseup', onEnd);
  vp.addEventListener('mouseleave', () => { if (isDragging) { isDragging = false; track.classList.remove('dragging'); setPickerTransform(key, state.selected[key], false); } });
}

function updatePreview() {
  const strip = document.getElementById('preview-strip');
  const cats = ['tops','bottoms','shoes'];
  let html = '<div class="preview-strip-title">当前搭配</div><div class="preview-items-row">';
  cats.forEach(cat => {
    const items = wardrobe[cat];
    const idx = state.selected[cat] || 0;
    if (items && items[idx]) {
      html += `<div class="preview-thumb"><img src="${items[idx].image}" alt=""></div>`;
    }
  });
  html += '</div><div class="preview-score">搭配指数 85 分</div>';
  strip.innerHTML = html;
}

// ===== OCCASION =====
document.querySelectorAll('.occasion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.occasion-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.occasion = btn.dataset.occasion;
    showToast('已切换到「' + state.occasion + '」');
  });
});

// ===== FAVORITE =====
function toggleFav() {
  const outfit = getCurrentOutfit();
  const dup = state.favorites.some(f =>
    f.top && f.top.id === outfit.top.id && f.bottom.id === outfit.bottom.id && f.shoes.id === outfit.shoes.id
  );
  if (dup) {
    state.favorites = state.favorites.filter(f =>
      !(f.top && f.top.id === outfit.top.id && f.bottom.id === outfit.bottom.id && f.shoes.id === outfit.shoes.id)
    );
    updateFavBtn(false);
    showToast('已取消收藏');
    return;
  }
  state.favorites.push({...outfit, date: new Date().toLocaleDateString('zh-CN')});
  updateFavBtn(true);
  showToast('已收藏');
}

function updateFavBtn(saved) {
  const btn = document.getElementById('btn-fav');
  if (saved) {
    btn.classList.add('saved');
    btn.querySelector('svg path').setAttribute('fill','currentColor');
  } else {
    btn.classList.remove('saved');
    btn.querySelector('svg path').setAttribute('fill','none');
  }
}

function getCurrentOutfit() {
  return {
    top: wardrobe.tops[state.selected.tops],
    bottom: wardrobe.bottoms[state.selected.bottoms],
    shoes: wardrobe.shoes[state.selected.shoes],
    occasion: state.occasion,
  };
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== INIT =====
buildMatchPage();
</script>
</body>
</html>
