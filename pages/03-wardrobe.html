<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - 我的衣柜</title>
<style>
:root {
  --bg: #F8F8F6; --card: #FFFFFF; --text-primary: #2D2D2D; --text-secondary: #8C8C8C;
  --accent: #8B7E74; --accent-light: #F0EDEA; --border: #E8E8E5; --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E8E8E5; color: var(--text-primary);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
}
.phone-frame {
  width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative; display: flex; flex-direction: column;
}
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }
.page { width:100%; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
.page::-webkit-scrollbar { display:none; }

.page-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; }
.page-header h2 { font-size:22px; font-weight:700; }
.btn-add {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--card);
  color:var(--text-primary); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.btn-add:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }

.wardrobe-tabs {
  display:flex; gap:4px; padding:0 20px; margin-bottom:16px;
  overflow-x:auto; border-bottom:1px solid var(--border);
}
.wardrobe-tabs::-webkit-scrollbar { display:none; }
.wardrobe-tab {
  padding:8px 12px 12px; font-size:13px; font-weight:500;
  color:var(--text-secondary); cursor:pointer;
  border:none; background:none; position:relative;
  transition:var(--transition); white-space:nowrap;
}
.wardrobe-tab.active { color:var(--accent); }
.wardrobe-tab.active::after {
  content:''; position:absolute;
  bottom:-1px; left:0; right:0;
  height:2px; background:var(--accent); border-radius:1px;
}

.wardrobe-grid { padding:0 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.wardrobe-card {
  background:var(--card); border-radius:var(--radius-sm);
  overflow:hidden; box-shadow:var(--shadow-sm);
  cursor:pointer; transition:var(--transition);
}
.wardrobe-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.wardrobe-card .card-img { width:100%; height:120px; object-fit:cover; }
.wardrobe-card .card-info { padding:8px; }
.wardrobe-card .card-name { font-size:11px; font-weight:500; margin-bottom:2px; }
.wardrobe-card .card-color {
  font-size:10px; color:var(--text-secondary);
  display:inline-block; padding:2px 6px;
  background:var(--accent-light); border-radius:4px;
}

/* Item Modal */
.item-modal {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center;
  z-index:150; opacity:0; pointer-events:none;
  transition:opacity 0.3s ease;
}
.item-modal.show { opacity:1; pointer-events:auto; }
.item-modal .modal-content {
  background:var(--card); border-radius:var(--radius-lg);
  width:280px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.item-modal .modal-img { width:100%; height:240px; object-fit:cover; }
.item-modal .modal-info { padding:16px 20px; }
.item-modal .modal-name { font-size:16px; font-weight:600; margin-bottom:4px; }
.item-modal .modal-color {
  display:inline-block; padding:3px 10px;
  background:var(--accent-light); border-radius:4px;
  font-size:12px; color:var(--text-secondary); margin-bottom:12px;
}
.item-modal .modal-close {
  width:100%; padding:12px; border:none;
  background:var(--accent-light); color:var(--text-primary);
  font-size:14px; font-weight:500; cursor:pointer;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  transition:var(--transition);
}
.item-modal .modal-close:hover { background:var(--accent); color:var(--white); }

/* Toast */
.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:500; z-index:300;
  opacity:0; transition:all 0.3s ease;
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#2D2D2D"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#2D2D2D"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D2D2D"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D2D2D" opacity="0.3"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#2D2D2D" stroke-width="1.5"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#2D2D2D"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#2D2D2D"/></svg>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h2>我的衣柜</h2>
      <button class="btn-add" onclick="showToast('拍照 / 相册选取（模拟）')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="wardrobe-tabs" id="wardrobe-tabs"></div>
    <div class="wardrobe-grid" id="wardrobe-grid"></div>
  </div>

  <div class="item-modal" id="item-modal" onclick="closeItemModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-info"><div class="modal-name" id="modal-name"></div><span class="modal-color" id="modal-color"></span></div>
      <button class="modal-close" onclick="closeItemModal()">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const wardrobe = {
  tops: [
    { id:1,  name:'白色 T 恤',     color:'白色', category:'上衣', image:'../assets/gen_tshirt_white.jpg' },
    { id:2,  name:'蓝色衬衫',     color:'蓝色', category:'上衣', image:'../assets/gen_shirt_blue.jpg' },
    { id:3,  name:'米色针织衫',   color:'米色', category:'上衣', image:'../assets/gen_knit_beige.jpg' },
    { id:4,  name:'黑色卫衣',     color:'黑色', category:'上衣', image:'../assets/gen_hoodie_black.jpg' },
    { id:5,  name:'卡其风衣',     color:'卡其', category:'上衣', image:'../assets/gen_coat_khaki.jpg' },
    { id:6,  name:'灰色开衫',     color:'灰色', category:'上衣', image:'../assets/gen_cardigan_grey.jpg' },
  ],
  bottoms: [
    { id:7,  name:'蓝色牛仔裤',   color:'蓝色', category:'下装', image:'../assets/gen_jeans_blue.jpg' },
    { id:8,  name:'黑色西裤',     color:'黑色', category:'下装', image:'../assets/gen_pants_black.jpg' },
    { id:9,  name:'米色半身裙',   color:'米色', category:'下装', image:'../assets/gen_skirt_beige.jpg' },
    { id:10, name:'灰色运动裤',   color:'灰色', category:'下装', image:'../assets/gen_jogger_grey.jpg' },
    { id:11, name:'白色阔腿裤',   color:'白色', category:'下装', image:'../assets/gen_widepants_white.jpg' },
    { id:12, name:'卡其短裤',     color:'卡其', category:'下装', image:'../assets/gen_shorts_khaki.jpg' },
  ],
  shoes: [
    { id:13, name:'白色运动鞋',   color:'白色', category:'鞋子', image:'../assets/gen_sneakers_white.jpg' },
    { id:14, name:'棕色短靴',     color:'棕色', category:'鞋子', image:'../assets/gen_boots_brown.jpg' },
    { id:15, name:'黑色乐福鞋',   color:'黑色', category:'鞋子', image:'../assets/gen_loafers_black.jpg' },
    { id:16, name:'米色凉鞋',     color:'米色', category:'鞋子', image:'../assets/gen_sandals_beige.jpg' },
  ],
  bags: [
    { id:17, name:'黑色链条包',   color:'黑色', category:'包包', image:'../assets/gen_bag_black.jpg' },
    { id:18, name:'米色托特包',   color:'米色', category:'包包', image:'../assets/gen_bag_beige.jpg' },
    { id:19, name:'棕色肩背包',   color:'棕色', category:'包包', image:'../assets/gen_bag_brown.jpg' },
  ],
  hats: [
    { id:20, name:'黑色棒球帽',   color:'黑色', category:'帽子', image:'../assets/gen_hat_black.jpg' },
    { id:21, name:'米色草帽',     color:'米色', category:'帽子', image:'../assets/gen_hat_beige.jpg' },
    { id:22, name:'灰色毛线帽',   color:'灰色', category:'帽子', image:'../assets/gen_hat_grey.jpg' },
  ],
  accessories: [
    { id:23, name:'金色项链',     color:'金色', category:'配饰', image:'../assets/gen_acc_gold.jpg' },
    { id:24, name:'银色耳环',     color:'银色', category:'配饰', image:'../assets/gen_acc_silver.jpg' },
    { id:25, name:'酒红色丝巾',   color:'酒红', category:'配饰', image:'../assets/gen_acc_scarf.jpg' },
  ],
};

const allItems = [
  ...wardrobe.tops, ...wardrobe.bottoms, ...wardrobe.shoes,
  ...wardrobe.bags, ...wardrobe.hats, ...wardrobe.accessories
];

const state = { wardrobeCat: 'all' };

function buildWardrobeTabs() {
  const tabs = document.getElementById('wardrobe-tabs');
  const cats = [
    { key:'all', label:'全部' },
    { key:'tops', label:'上衣' },
    { key:'bottoms', label:'下装' },
    { key:'shoes', label:'鞋子' },
    { key:'bags', label:'包包' },
    { key:'hats', label:'帽子' },
    { key:'accessories', label:'配饰' },
  ];
  tabs.innerHTML = cats.map(c => '<button class="wardrobe-tab'+(c.key==='all'?' active':'')+'" data-cat="'+c.key+'" onclick="filterWardrobe(\''+c.key+'\')">'+c.label+'</button>').join('');
}

function filterWardrobe(cat) {
  state.wardrobeCat = cat;
  document.querySelectorAll('.wardrobe-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.wardrobe-tab[data-cat="'+cat+'"]').classList.add('active');
  renderWardrobe();
}

function renderWardrobe() {
  const grid = document.getElementById('wardrobe-grid');
  let items = allItems;
  if (state.wardrobeCat !== 'all') items = wardrobe[state.wardrobeCat] || [];
  grid.innerHTML = items.map(item => '<div class="wardrobe-card" onclick="openItemModal('+item.id+')"><img class="card-img" src="'+item.image+'" alt="'+item.name+'" loading="lazy"><div class="card-info"><div class="card-name">'+item.name+'</div><span class="card-color">'+item.color+'</span></div></div>').join('');
}

function openItemModal(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  document.getElementById('modal-img').src = item.image;
  document.getElementById('modal-name').textContent = item.name;
  document.getElementById('modal-color').textContent = item.color;
  document.getElementById('item-modal').classList.add('show');
}
function closeItemModal() { document.getElementById('item-modal').classList.remove('show'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// INIT
buildWardrobeTabs();
renderWardrobe();
</script>
</body>
</html>
