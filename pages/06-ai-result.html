<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - AI 搭配推荐</title>
<style>
:root {
  --bg: #FAFAFA; --card: #FFFFFF; --text-primary: #2D2D2D; --text-secondary: #8C8C8C;
  --accent: #1A1A1A; --accent-light: #F2F2F2; --border: #E9E9E9; --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E9E9E9; color: var(--text-primary);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
}
.phone-frame {
  width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative; display: flex; flex-direction: column;
}
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }
.page { width:100%; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
.page::-webkit-scrollbar { display:none; }

/* Sub header */
.sub-header {
  display:flex; align-items:center;
  padding:16px 20px; gap:12px;
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.sub-header .back-btn {
  width:36px; height:36px; border:none; background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color: var(--text-primary); border-radius:50%; transition:var(--transition);
}
.sub-header .back-btn:hover { background:var(--accent-light); }
.sub-header .sub-title { font-size:17px; font-weight:600; }

/* AI Result */
.ai-result-weather {
  display:flex; align-items:center; gap:8px;
  padding:12px 20px; margin:0 16px 16px;
  background:var(--card); border-radius:var(--radius-md);
  font-size:13px; color:var(--text-secondary);
}
.ai-result-items { padding:0 16px; margin-bottom:16px; }
.ai-result-item {
  background:var(--card); border-radius:var(--radius-md);
  overflow:hidden; margin-bottom:12px; box-shadow:var(--shadow-sm);
}
.ai-result-item img { width:100%; height:180px; object-fit:cover; }
.ai-result-item .item-label {
  padding:10px 16px; font-size:14px; font-weight:500;
  display:flex; align-items:center; justify-content:space-between;
}
.ai-result-item .item-label .item-cat { font-size:12px; color:var(--text-secondary); }

.ai-result-nav {
  display:flex; align-items:center; justify-content:center;
  gap:20px; padding:12px;
}
.ai-result-nav button {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--card);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text-primary); transition:var(--transition);
}
.ai-result-nav button:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }
.ai-result-nav .nav-counter { font-size:14px; color:var(--text-secondary); font-weight:500; }

.ai-result-actions { display:flex; gap:10px; padding:0 16px; margin-bottom:24px; }
.ai-result-actions button {
  flex:1; padding:12px; border-radius:var(--radius-xl);
  font-size:14px; font-weight:500; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:var(--transition); border:none;
}
.ai-result-actions .btn-rfav { background:var(--card); color:var(--text-primary); border:1px solid var(--border) !important; }
.ai-result-actions .btn-rfav.saved { background:var(--accent); color:var(--white); border-color:var(--accent) !important; }
.ai-result-actions .btn-rrefresh { background:var(--accent-light); color:var(--accent); }

.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:500; z-index:300;
  opacity:0; transition:all 0.3s ease;
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#2D2D2D"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#2D2D2D"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D2D2D"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D2D2D" opacity="0.3"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#2D2D2D" stroke-width="1.5"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#2D2D2D"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#2D2D2D"/></svg>
    </div>
  </div>

  <div class="page">
    <div class="sub-header">
      <button class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="sub-title">AI 搭配推荐</span>
    </div>

    <div class="ai-result-weather">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg>
      <span>25°C · 通勤</span>
    </div>

    <div class="ai-result-items">
      <div class="ai-result-item"><img id="result-top-img" src="" alt=""><div class="item-label"><span id="result-top-name"></span><span class="item-cat">上衣</span></div></div>
      <div class="ai-result-item"><img id="result-bottom-img" src="" alt=""><div class="item-label"><span id="result-bottom-name"></span><span class="item-cat">下装</span></div></div>
      <div class="ai-result-item"><img id="result-shoes-img" src="" alt=""><div class="item-label"><span id="result-shoes-name"></span><span class="item-cat">鞋子</span></div></div>
    </div>

    <div class="ai-result-nav">
      <button onclick="navResult(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="nav-counter" id="result-counter">1 / 8</span>
      <button onclick="navResult(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>

    <div class="ai-result-actions">
      <button class="btn-rfav" id="btn-rfav" onclick="toggleResultFav()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 收藏</button>
      <button class="btn-rrefresh" onclick="refreshResults()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg> 换一批</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const wardrobe = {
  tops: [
    { id:1,  name:'白色 T 恤',     color:'白色', category:'上衣', image:'../assets/gen_tshirt_white.jpg' },
    { id:2,  name:'蓝色衬衫',     color:'蓝色', category:'上衣', image:'../assets/gen_shirt_blue.jpg' },
    { id:3,  name:'米色针织衫',   color:'米色', category:'上衣', image:'../assets/gen_knit_beige.jpg' },
    { id:4,  name:'黑色卫衣',     color:'黑色', category:'上衣', image:'../assets/gen_hoodie_black.jpg' },
    { id:5,  name:'卡其风衣',     color:'卡其', category:'上衣', image:'../assets/gen_coat_khaki.jpg' },
    { id:6,  name:'灰色开衫',     color:'灰色', category:'上衣', image:'../assets/gen_cardigan_grey.jpg' },
  ],
  bottoms: [
    { id:7,  name:'蓝色牛仔裤',   color:'蓝色', category:'下装', image:'../assets/gen_jeans_blue.jpg' },
    { id:8,  name:'黑色西裤',     color:'黑色', category:'下装', image:'../assets/gen_pants_black.jpg' },
    { id:9,  name:'米色半身裙',   color:'米色', category:'下装', image:'../assets/gen_skirt_beige.jpg' },
    { id:10, name:'灰色运动裤',   color:'灰色', category:'下装', image:'../assets/gen_jogger_grey.jpg' },
    { id:11, name:'白色阔腿裤',   color:'白色', category:'下装', image:'../assets/gen_widepants_white.jpg' },
    { id:12, name:'卡其短裤',     color:'卡其', category:'下装', image:'../assets/gen_shorts_khaki.jpg' },
  ],
  shoes: [
    { id:13, name:'白色运动鞋',   color:'白色', category:'鞋子', image:'../assets/gen_sneakers_white.jpg' },
    { id:14, name:'棕色短靴',     color:'棕色', category:'鞋子', image:'../assets/gen_boots_brown.jpg' },
    { id:15, name:'黑色乐福鞋',   color:'黑色', category:'鞋子', image:'../assets/gen_loafers_black.jpg' },
    { id:16, name:'米色凉鞋',     color:'米色', category:'鞋子', image:'../assets/gen_sandals_beige.jpg' },
  ],
};

const state = { aiResults: [], aiResultIdx: 0 };

function generateAIResults() {
  state.aiResults = [];
  for (let i=0; i<8; i++) {
    state.aiResults.push({
      top: wardrobe.tops[Math.floor(Math.random()*wardrobe.tops.length)],
      bottom: wardrobe.bottoms[Math.floor(Math.random()*wardrobe.bottoms.length)],
      shoes: wardrobe.shoes[Math.floor(Math.random()*wardrobe.shoes.length)],
    });
  }
}

function renderAIResult() {
  const r = state.aiResults[state.aiResultIdx]; if (!r) return;
  document.getElementById('result-top-img').src = r.top.image;
  document.getElementById('result-top-name').textContent = r.top.name;
  document.getElementById('result-bottom-img').src = r.bottom.image;
  document.getElementById('result-bottom-name').textContent = r.bottom.name;
  document.getElementById('result-shoes-img').src = r.shoes.image;
  document.getElementById('result-shoes-name').textContent = r.shoes.name;
  document.getElementById('result-counter').textContent = (state.aiResultIdx+1) + ' / ' + state.aiResults.length;
}

function navResult(dir) {
  let n = state.aiResultIdx + dir;
  if (n<0) n=state.aiResults.length-1;
  if (n>=state.aiResults.length) n=0;
  state.aiResultIdx = n;
  renderAIResult();
}

function refreshResults() {
  generateAIResults(); state.aiResultIdx=0; renderAIResult(); showToast('已刷新搭配');
}

function toggleResultFav() {
  const r = state.aiResults[state.aiResultIdx];
  const btn = document.getElementById('btn-rfav');
  btn.classList.add('saved'); btn.querySelector('svg path').setAttribute('fill','currentColor');
  setTimeout(()=>{ btn.classList.remove('saved'); btn.querySelector('svg path').setAttribute('fill','none'); },2000);
  showToast('已收藏');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// INIT
generateAIResults();
renderAIResult();
</script>
</body>
</html>
