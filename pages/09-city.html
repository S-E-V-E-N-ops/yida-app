<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - 所在城市</title>
<style>
:root {
  --bg: #F8F8F6; --card: #FFFFFF; --text-primary: #2D2D2D; --text-secondary: #8C8C8C;
  --accent: #8B7E74; --accent-light: #F0EDEA; --border: #E8E8E5; --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E8E8E5; color: var(--text-primary);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
}
.phone-frame {
  width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative; display: flex; flex-direction: column;
}
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }
.page { width:100%; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
.page::-webkit-scrollbar { display:none; }

.sub-header {
  display:flex; align-items:center;
  padding:16px 20px; gap:12px;
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.sub-header .back-btn {
  width:36px; height:36px; border:none; background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color: var(--text-primary); border-radius:50%; transition:var(--transition);
}
.sub-header .back-btn:hover { background:var(--accent-light); }
.sub-header .sub-title { font-size:17px; font-weight:600; }

.city-option {
  padding:10px 16px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--card);
  font-size:13px; font-weight:500; color:var(--text-primary);
  cursor:pointer; transition:var(--transition);
}
.city-option:hover { border-color:var(--accent); background:var(--accent-light); }
.city-option.selected { background:var(--accent); color:var(--white); border-color:var(--accent); }

.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:500; z-index:300;
  opacity:0; transition:all 0.3s ease;
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#2D2D2D"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#2D2D2D"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D2D2D"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D2D2D" opacity="0.3"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#2D2D2D" stroke-width="1.5"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#2D2D2D"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#2D2D2D"/></svg>
    </div>
  </div>

  <div class="page">
    <div class="sub-header">
      <button class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="sub-title">所在城市</span>
    </div>
    <div id="city-content" style="padding:0 16px;"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const cityList = [
  '北京','上海','广州','深圳','杭州','成都','南京','武汉',
  '西安','重庆','长沙','苏州','天津','青岛','郑州','大连',
  '厦门','昆明','珠海','福州','合肥','宁波','无锡','佛山'
];
let currentCity = '北京';

function renderCityList() {
  const c = document.getElementById('city-content');
  const hot = ['北京','上海','广州','深圳','杭州','成都'];
  const rest = cityList.filter(ci => !hot.includes(ci));

  c.innerHTML = '<div style="margin-bottom:20px;"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;">当前城市</div><div style="padding:14px 16px;background:var(--accent-light);border-radius:var(--radius-md);font-size:15px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+currentCity+'</div></div><div style="margin-bottom:20px;"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;">热门城市</div><div style="display:flex;flex-wrap:wrap;gap:8px;">'+hot.map(city => '<button class="city-option'+(city===currentCity?' selected':'')+'" onclick="selectCity(\''+city+'\')">'+city+'</button>').join('')+'</div></div><div><div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;">全部城市</div><div style="display:flex;flex-wrap:wrap;gap:8px;">'+rest.map(city => '<button class="city-option'+(city===currentCity?' selected':'')+'" onclick="selectCity(\''+city+'\')">'+city+'</button>').join('')+'</div></div>';
}

function selectCity(city) {
  currentCity = city;
  renderCityList();
  showToast('城市已切换为「'+city+'」');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

renderCityList();
</script>
</body>
</html>
