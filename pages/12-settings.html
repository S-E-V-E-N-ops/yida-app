<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>衣搭 - 设置</title>
<style>
:root {
  --bg: #FAFAFA; --card: #FFFFFF; --text-primary: #2D2D2D; --text-secondary: #8C8C8C;
  --accent: #1A1A1A; --accent-light: #F2F2F2; --border: #E9E9E9; --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #E9E9E9; color: var(--text-primary);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
}
.phone-frame {
  width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 8px #1a1a1e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
  position: relative; display: flex; flex-direction: column;
}
.status-bar {
  height: 50px; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0;
}
.status-bar .time { font-size:15px; font-weight:600; }
.status-bar .icons { display:flex; gap:4px; }
.page { width:100%; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling: touch; background: var(--bg); }
.page::-webkit-scrollbar { display:none; }

.sub-header {
  display:flex; align-items:center;
  padding:16px 20px; gap:12px;
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.sub-header .back-btn {
  width:36px; height:36px; border:none; background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color: var(--text-primary); border-radius:50%; transition:var(--transition);
}
.sub-header .back-btn:hover { background:var(--accent-light); }
.sub-header .sub-title { font-size:17px; font-weight:600; }

.settings-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer;
}
.settings-row:last-child { border-bottom:none; }
.sr-label { font-size:14px; font-weight:500; }
.sr-value { font-size:13px; color:var(--text-secondary); }

.settings-toggle {
  width:44px; height:26px; border-radius:13px; background:var(--border);
  cursor:pointer; position:relative; transition:var(--transition); flex-shrink:0;
}
.settings-toggle.on { background:var(--accent); }
.settings-toggle::after {
  content:''; position:absolute; top:3px; left:3px;
  width:20px; height:20px; border-radius:50%;
  background:var(--white); box-shadow:var(--shadow-sm); transition:var(--transition);
}
.settings-toggle.on::after { left:21px; }

.toast {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--text-primary); color:var(--white);
  padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:500; z-index:300;
  opacity:0; transition:all 0.3s ease;
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:440px) {
  body { padding:0; }
  .phone-frame { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#2D2D2D"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#2D2D2D"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D2D2D"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D2D2D" opacity="0.3"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#2D2D2D" stroke-width="1.5"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#2D2D2D"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#2D2D2D"/></svg>
    </div>
  </div>

  <div class="page">
    <div class="sub-header">
      <button class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="sub-title">设置</span>
    </div>
    <div id="settings-content" style="padding:0 16px;"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const settingsState = {
  notifications: true,
  darkMode: false,
  autoWeather: true,
  language: '中文',
};

function renderSettings() {
  const c = document.getElementById('settings-content');
  c.innerHTML = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;font-weight:500;">通用设置</div>'
    + settingsToggle('通知提醒','notifications','每日穿搭提醒、搭配推荐推送', settingsState.notifications)
    + settingsToggle('自动获取天气','autoWeather','根据城市自动更新天气信息', settingsState.autoWeather)
    + settingsToggle('深色模式','darkMode','切换暗色主题', settingsState.darkMode)
    + '<div style="font-size:13px;color:var(--text-secondary);margin:20px 0 14px;font-weight:500;">个性化</div>'
    + '<div class="settings-row" onclick="showToast(\'语言设置（模拟）\')"><span class="sr-label">语言</span><span class="sr-value">'+settingsState.language+'</span></div>'
    + '<div class="settings-row" onclick="showToast(\'单位设置（模拟）\')"><span class="sr-label">温度单位</span><span class="sr-value">摄氏度 °C</span></div>'
    + '<div class="settings-row" onclick="showToast(\'隐私设置（模拟）\')"><span class="sr-label">隐私与安全</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg></div>'
    + '<div style="font-size:13px;color:var(--text-secondary);margin:20px 0 14px;font-weight:500;">数据</div>'
    + '<div class="settings-row" onclick="showToast(\'缓存已清除\')"><span class="sr-label">清除缓存</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg></div>'
    + '<div class="settings-row" onclick="showToast(\'数据已导出\')"><span class="sr-label">导出衣柜数据</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg></div>'
    + '<div style="text-align:center;margin-top:24px;font-size:12px;color:var(--text-secondary);opacity:0.5;">衣搭 v1.0.0</div>';
}

function settingsToggle(label, key, desc, value) {
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);"><div><div style="font-size:14px;font-weight:500;margin-bottom:2px;">'+label+'</div><div style="font-size:11px;color:var(--text-secondary);">'+desc+'</div></div><div class="settings-toggle'+(value?' on':'')+'" onclick="toggleSetting(\''+key+'\')"></div></div>';
}

function toggleSetting(key) {
  settingsState[key] = !settingsState[key];
  renderSettings();
  var labelMap = { notifications:'通知提醒', darkMode:'深色模式', autoWeather:'自动获取天气' };
  showToast((labelMap[key] || key) + '已' + (settingsState[key] ? '开启' : '关闭'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

renderSettings();
</script>
</body>
</html>
